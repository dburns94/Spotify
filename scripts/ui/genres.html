<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genres — Spotify Playlist Tools</title>
  <link rel="stylesheet" href="/shared.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="main">
    <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
      <h2 style="color:#1DB954; margin:0;">Genres</h2>
      <select id="sortMode" class="sort-select" style="padding:6px 10px;" onchange="renderGenres(); syncUrl();">
        <option value="tracks">Most Tracks</option>
        <option value="artists">Most Artists</option>
        <option value="alpha">Alphabetical</option>
      </select>
      <input type="text" id="filterInput" placeholder="Filter genres..." class="search-input" style="width:250px;" oninput="renderGenres(); syncUrl(400);">
      <span style="color:#888; font-size:13px; display:inline-flex; align-items:center; gap:4px;">
        Min tracks: <input type="number" id="minTracks" value="1" min="1" max="100" style="width:50px; padding:4px 6px; border:1px solid #333; border-radius:4px; background:#252525; color:#e0e0e0; font-size:12px;" onchange="renderGenres(); syncUrl();">
      </span>
      <span id="genreCount" style="color:#888; font-size:13px;"></span>
      <p class="page-subhead" style="width:100%; flex-basis:100%;">Genres derived from the artists across your playlists.</p>
    </div>

    <div id="content">
      <div class="loading"><span class="spinner"></span> Loading genres...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    let genres = [];
    const _p = getUrlParams();

    function syncUrl(debounce = 0) {
      persistParams({
        filter: document.getElementById('filterInput')?.value || '',
        sortMode: (document.getElementById('sortMode')?.value) !== 'tracks' ? document.getElementById('sortMode')?.value : '',
        minTracks: (document.getElementById('minTracks')?.value || '1') !== '1' ? document.getElementById('minTracks')?.value : '',
      }, { debounce });
    }

    async function init() {
      document.getElementById('headerContainer').innerHTML = getHeaderHtml('genres');
      const plData = await api('/api/playlists');
      _cacheTimestamp = plData.cached_at;
      updateHeaderAgo();
      if (_cacheInterval) clearInterval(_cacheInterval);
      _cacheInterval = setInterval(updateHeaderAgo, 30000);

      // Restore controls from URL before first render.
      if (_p.filter) document.getElementById('filterInput').value = _p.filter;
      if (_p.sortMode) document.getElementById('sortMode').value = _p.sortMode;
      if (_p.minTracks) document.getElementById('minTracks').value = _p.minTracks;

      const data = await api('/api/genres');
      genres = data.genres;
      renderGenres();
    }

    function renderGenres() {
      const container = document.getElementById('content');
      const sortMode = document.getElementById('sortMode').value;
      const filterText = (document.getElementById('filterInput')?.value || '').toLowerCase();
      const minTracks = parseInt(document.getElementById('minTracks')?.value || '1', 10);

      let filtered = genres.filter(g => g.trackCount >= minTracks);
      if (filterText) {
        filtered = filtered.filter(g => g.name.toLowerCase().includes(filterText));
      }

      document.getElementById('genreCount').textContent = `${filtered.length} genre${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">No genres found.</p>';
        return;
      }

      const sorted = [...filtered];
      if (sortMode === 'tracks') sorted.sort((a, b) => b.trackCount - a.trackCount);
      else if (sortMode === 'artists') sorted.sort((a, b) => b.artistCount - a.artistCount);
      else sorted.sort((a, b) => a.name.localeCompare(b.name));

      const rows = sorted.map((g, i) => `
        <tr>
          <td style="color:#888">${i + 1}</td>
          <td><a href="/genre/${encodeURIComponent(g.name)}" style="color:#e0e0e0; text-decoration:none;">${escHtml(g.name)}</a></td>
          <td style="text-align:center; color:#888">${g.trackCount}</td>
          <td style="text-align:center; color:#888">${g.artistCount}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table class="data-table">
          <thead><tr>
            <th style="width:40px">#</th>
            <th>Genre</th>
            <th style="text-align:center">Tracks</th>
            <th style="text-align:center">Artists</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    init();
  </script>
</body>
</html>
