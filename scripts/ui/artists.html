<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artists — Spotify Playlist Tools</title>
  <link rel="stylesheet" href="/shared.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="main">
    <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
      <h2 style="color:#1DB954; margin:0;">Artists</h2>
      <select id="viewMode" class="sort-select" style="padding:6px 10px;" onchange="renderArtists(); syncUrl();">
        <option value="count">Most Tracks</option>
        <option value="alpha">Alphabetical</option>
      </select>
      <div id="playlistFilterContainer" style="position:relative;">
        <button class="sort-select" style="padding:6px 10px; width:220px; text-align:left; cursor:pointer;" onclick="togglePlaylistDropdown()" id="playlistFilterBtn">All Playlists</button>
        <div id="playlistDropdown" style="display:none; position:absolute; top:100%; left:0; width:280px; max-height:300px; overflow-y:auto; background:#252525; border:1px solid #333; border-radius:6px; z-index:50; margin-top:4px; padding:4px 0;">
        </div>
      </div>
      <input type="text" id="filterInput" placeholder="Filter artists..." class="search-input" style="width:250px;" oninput="renderArtists(); syncUrl(400);">
      <span id="artistCount" style="color:#888; font-size:13px;"></span>
    </div>

    <div id="content">
      <div class="loading"><span class="spinner"></span> Loading artists...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    let artists = [];
    const _p = getUrlParams();

    function syncUrl(debounce = 0) {
      persistParams({
        filter: document.getElementById('filterInput')?.value || '',
        view: (document.getElementById('viewMode')?.value) !== 'count' ? document.getElementById('viewMode')?.value : '',
        pl: getSelectedPlaylists(),
      }, { debounce });
    }

    async function init() {
      document.getElementById('headerContainer').innerHTML = getHeaderHtml('artists');
      const plData = await api('/api/playlists');
      _cacheTimestamp = plData.cached_at;
      updateHeaderAgo();
      if (_cacheInterval) clearInterval(_cacheInterval);
      _cacheInterval = setInterval(updateHeaderAgo, 30000);

      const data = await api('/api/artists');
      artists = data.artists;
      document.getElementById('artistCount').textContent = `${artists.length} artists`;

      // Populate playlist filter dropdown with checkboxes
      const allPlaylists = [...new Set(artists.flatMap(a => a.playlists))].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
      const dropdown = document.getElementById('playlistDropdown');
      dropdown.innerHTML = `<div style="padding:4px 12px; border-bottom:1px solid #333; margin-bottom:4px;">
        <button class="btn btn-secondary btn-small" style="width:100%; font-size:11px;" onclick="clearPlaylistFilter()">Clear All</button>
      </div>` + allPlaylists.map(p => `
        <label style="display:flex; align-items:center; gap:8px; padding:4px 12px; cursor:pointer; font-size:13px; color:#e0e0e0;" onmouseover="this.style.background='#333'" onmouseout="this.style.background=''">
          <input type="checkbox" value="${escHtml(p)}" onchange="updatePlaylistFilter()" style="accent-color:#1DB954; width:16px; height:16px; flex-shrink:0;">
          ${escHtml(p)}
        </label>
      `).join('');

      // Restore controls from URL now that inputs/checkboxes exist.
      if (_p.filter) document.getElementById('filterInput').value = _p.filter;
      if (_p.view) document.getElementById('viewMode').value = _p.view;
      if (_p.pl) {
        const wanted = new Set(_p.pl.split(',').filter(Boolean));
        dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => { if (wanted.has(cb.value)) cb.checked = true; });
        updatePlaylistFilterLabel();
      }

      renderArtists();
    }

    function renderArtists() {
      const container = document.getElementById('content');
      const mode = document.getElementById('viewMode').value;
      const filterText = (document.getElementById('filterInput')?.value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const selectedPlaylists = getSelectedPlaylists();

      let filtered = artists;
      if (selectedPlaylists.length > 0) {
        filtered = filtered.filter(a => selectedPlaylists.some(p => a.playlists.includes(p)));
      }
      if (filterText) {
        filtered = filtered.filter(a => a.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(filterText));
      }

      document.getElementById('artistCount').textContent = `${filtered.length} artist${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">No artists found.</p>';
        return;
      }

      if (mode === 'count') {
        renderByCount(container, filtered);
      } else {
        renderAlphabetical(container, filtered);
      }
    }

    function renderByCount(container, list) {
      const selectedPlaylists = getSelectedPlaylists();
      const sorted = [...list].sort((a, b) => {
        const aCount = selectedPlaylists.length > 0 ? selectedPlaylists.reduce((sum, p) => sum + (a.playlistCounts?.[p] || 0), 0) : a.count;
        const bCount = selectedPlaylists.length > 0 ? selectedPlaylists.reduce((sum, p) => sum + (b.playlistCounts?.[p] || 0), 0) : b.count;
        return bCount - aCount;
      });
      const rows = sorted.map((a, i) => {
        const displayCount = selectedPlaylists.length > 0 ? selectedPlaylists.reduce((sum, p) => sum + (a.playlistCounts?.[p] || 0), 0) : a.count;
        return `
        <tr>
          <td style="color:#888">${i + 1}</td>
          <td><a href="/artist/${encodeURIComponent(a.name)}" style="color:#e0e0e0; text-decoration:none;">${escHtml(a.name)}</a></td>
          <td style="text-align:center; color:#888">${displayCount}</td>
          <td style="text-align:center; color:#888">${a.playlistCount}</td>
          <td>${a.genres.map(g => `<a href="/genre/${encodeURIComponent(g)}" class="artist-chip" style="font-size:11px; padding:2px 8px;">${escHtml(g)}</a>`).join(' ')}</td>
        </tr>
      `}).join('');

      container.innerHTML = `
        <table class="data-table">
          <thead><tr>
            <th style="width:40px">#</th>
            <th>Artist</th>
            <th style="text-align:center">Tracks</th>
            <th style="text-align:center">Playlists</th>
            <th>Genres</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function renderAlphabetical(container, list) {
      const sorted = [...list].sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));

      // Group by first letter
      const groups = new Map();
      for (const a of sorted) {
        const letter = a.name[0].toUpperCase();
        const key = /[A-Z]/.test(letter) ? letter : '#';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(a);
      }

      let html = '<div style="margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap;">';
      for (const letter of groups.keys()) {
        html += `<a href="#letter-${letter}" class="btn btn-secondary btn-small" style="min-width:28px; text-align:center;">${letter}</a>`;
      }
      html += '</div>';

      for (const [letter, artists] of groups) {
        html += `<div id="letter-${letter}" style="margin-bottom:20px;">`;
        html += `<h3 style="color:#1DB954; border-bottom:1px solid #333; padding-bottom:4px; margin-bottom:8px;">${letter}</h3>`;
        html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:8px;">';
        for (const a of artists) {
          html += `<a href="/artist/${encodeURIComponent(a.name)}" class="artist-chip" style="display:flex; justify-content:space-between; padding:8px 12px; border-radius:6px;">
            <span>${escHtml(a.name)}</span>
            <span class="count">${a.count}</span>
          </a>`;
        }
        html += '</div></div>';
      }

      container.innerHTML = html;
    }

    // Playlist filter dropdown helpers
    function togglePlaylistDropdown() {
      const dropdown = document.getElementById('playlistDropdown');
      dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }

    function getSelectedPlaylists() {
      const checkboxes = document.querySelectorAll('#playlistDropdown input[type="checkbox"]:checked');
      return [...checkboxes].map(cb => cb.value);
    }

    function updatePlaylistFilterLabel() {
      const selected = getSelectedPlaylists();
      const btn = document.getElementById('playlistFilterBtn');
      if (selected.length === 0) btn.textContent = 'All Playlists';
      else if (selected.length === 1) btn.textContent = selected[0];
      else btn.textContent = `${selected.length} playlists selected`;
    }

    function updatePlaylistFilter() {
      updatePlaylistFilterLabel();
      syncUrl();
      renderArtists();
    }

    function clearPlaylistFilter() {
      document.querySelectorAll('#playlistDropdown input[type="checkbox"]').forEach(cb => cb.checked = false);
      updatePlaylistFilter();
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const container = document.getElementById('playlistFilterContainer');
      if (container && !container.contains(e.target)) {
        document.getElementById('playlistDropdown').style.display = 'none';
      }
    });

    init();
  </script>
</body>
</html>
