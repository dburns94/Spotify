<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discography — Spotify Playlist Tools</title>
  <link rel="stylesheet" href="/shared.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="main">
    <div id="content">
      <div class="loading"><span class="spinner"></span> Loading discography from Spotify...</div>
    </div>
  </div>

  <!-- Duplicates modal -->
  <div class="modal-overlay" id="duplicatesModal">
    <div class="modal">
      <h3>Duplicates Detected</h3>
      <p id="duplicatesModalText"></p>
      <label style="display:inline-flex; align-items:center; gap:6px; margin-bottom:16px; font-size:13px; color:#888; cursor:pointer; line-height:1;">
        <input type="checkbox" id="duplicatesIncludeCheckbox" style="accent-color:#1DB954; width:14px; height:14px; flex-shrink:0; margin:0;"> Include duplicates anyway
      </label>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('duplicatesModal')">Cancel</button>
        <button class="btn btn-primary" id="duplicatesConfirmBtn">Add Tracks</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/shared.js"></script>
  <script>
    const artistName = decodeURIComponent(window.location.pathname.split('/discography/')[1]);
    const artistId = new URLSearchParams(window.location.search).get('id') || '';
    let tracks = [];
    let playlists = [];
    let genres = [];
    let albumCount = 0;
    let resolvedArtist = artistName;
    let selectedTrackUris = new Map();
    const _urlParams = new URLSearchParams(window.location.search);
    let sortField = _urlParams.get('sort') || 'release_date';
    let sortDir = _urlParams.get('dir') || 'desc';
    let hideDuplicates = _urlParams.get('dupes') !== 'show'; // default: hide
    const _initialFilter = _urlParams.get('filter') || '';

    // Write view state (filter, sort, dupes toggle) into the URL without reloading.
    function syncUrl() {
      const params = new URLSearchParams();
      if (artistId) params.set('id', artistId);
      const filterVal = document.getElementById('discogFilterInput')?.value || _initialFilter;
      if (filterVal) params.set('filter', filterVal);
      if (sortField !== 'release_date') params.set('sort', sortField);
      if (sortDir !== 'desc') params.set('dir', sortDir);
      if (!hideDuplicates) params.set('dupes', 'show');
      const qs = params.toString();
      history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
    }

    // Normalize a track title for duplicate grouping: drop parenthetical/bracketed
    // qualifiers (Remastered, feat., Deluxe, Live, etc.), punctuation, and casing.
    function dupeKey(name) {
      return (name || '')
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\([^)]*\)/g, '')
        .replace(/\[[^\]]*\]/g, '')
        .replace(/\s*-\s*(remaster(ed)?|live|mono|stereo|single version|album version|radio edit|deluxe|bonus track|edit|version|acoustic|demo)\b.*$/i, '')
        .replace(/[^\w\s]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Collapse tracks sharing a dupeKey to the single most popular version.
    // Returns { list, dupeCounts } where dupeCounts maps kept-track-uri -> hidden count.
    function dedupeTracks(list) {
      const groups = new Map(); // key -> [tracks]
      for (const t of list) {
        const key = dupeKey(t.name);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      }
      const out = [];
      const dupeCounts = new Map();
      for (const group of groups.values()) {
        const best = group.reduce((a, b) => ((b.popularity || 0) > (a.popularity || 0) ? b : a));
        out.push(best);
        if (group.length > 1) dupeCounts.set(best.uri, group.length - 1);
      }
      return { list: out, dupeCounts };
    }

    async function init() {
      document.getElementById('headerContainer').innerHTML = getHeaderHtml('');
      const plData = await api('/api/playlists');
      playlists = plData.playlists;
      _cacheTimestamp = plData.cached_at;
      updateHeaderAgo();
      if (_cacheInterval) clearInterval(_cacheInterval);
      _cacheInterval = setInterval(updateHeaderAgo, 30000);
      await loadDiscography();
    }

    async function loadDiscography() {
      try {
        let url = `/api/spotify-discography?artist=${encodeURIComponent(artistName)}`;
        if (artistId) url += `&id=${encodeURIComponent(artistId)}`;
        const data = await api(url);
        if (!data.found) {
          document.getElementById('content').innerHTML = `<div class="loading">No artist found on Spotify for "${escHtml(artistName)}".</div>`;
          return;
        }
        tracks = data.tracks;
        genres = data.genres || [];
        albumCount = data.albumCount || 0;
        resolvedArtist = data.artist || artistName;
        document.title = `${resolvedArtist} — Discography`;
        render();
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="loading" style="color:#e74c3c">${err.message}</div>`;
      }
    }

    function render() {
      const rawFilter = document.getElementById('discogFilterInput')?.value ?? _initialFilter;
      const filterText = rawFilter.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const filtered = filterText
        ? tracks.filter(t => norm(t.name).includes(filterText) || norm(t.artist).includes(filterText) || norm(t.album).includes(filterText))
        : tracks;

      const deduped = hideDuplicates ? dedupeTracks(filtered) : { list: filtered, dupeCounts: new Map() };
      const displayTracks = deduped.list;
      const dupeCounts = deduped.dupeCounts;
      const hiddenDupeCount = filtered.length - displayTracks.length;

      const sorted = [...displayTracks].sort((a, b) => {
        let cmp = 0;
        if (sortField === 'name') cmp = a.name.toLowerCase().localeCompare(b.name.toLowerCase());
        else if (sortField === 'artist') cmp = (a.artist || '').toLowerCase().localeCompare((b.artist || '').toLowerCase());
        else if (sortField === 'album') cmp = (a.album || '').toLowerCase().localeCompare((b.album || '').toLowerCase());
        else if (sortField === 'duration_ms') cmp = (a.duration_ms || 0) - (b.duration_ms || 0);
        else if (sortField === 'popularity') cmp = (a.popularity || 0) - (b.popularity || 0);
        else if (sortField === 'release_date') cmp = (a.release_date || '').localeCompare(b.release_date || '');
        else if (sortField === 'library') cmp = (a.inLibrary ? 1 : 0) - (b.inLibrary ? 1 : 0);
        return sortDir === 'asc' ? cmp : -cmp;
      });

      const totalMs = tracks.reduce((s, t) => s + (t.duration_ms || 0), 0);
      const inLibraryCount = tracks.filter(t => t.inLibrary).length;

      function arrow(field) {
        if (sortField !== field) return '';
        return sortDir === 'asc' ? ' &#9650;' : ' &#9660;';
      }

      const ownedPlaylists = playlists.filter(p => p.isOwned !== false).sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
      const targetOptions = ownedPlaylists.map(p => `<option value="${p.id}">${escHtml(p.name)}</option>`).join('');

      const rows = sorted.map((t, i) => {
        const checked = selectedTrackUris.has(t.uri) ? 'checked' : '';
        const libraryBadge = t.inLibrary ? `<span class="in-library-badge">In Library</span>` : '';
        return `
        <tr>
          <td><input type="checkbox" ${checked} onchange="toggleTrack('${t.uri}', '${escAttr(t.name)}', '${escAttr(t.artist)}', this.checked)"></td>
          <td style="color:#888">${i + 1}</td>
          <td>${escHtml(t.name)}${t.explicit ? '<span class="explicit-badge">E</span>' : ''}${libraryBadge}${dupeCounts.get(t.uri) ? `<span class="version-badge" title="${dupeCounts.get(t.uri)} other version(s) hidden">+${dupeCounts.get(t.uri)}</span>` : ''}<button class="queue-btn" onclick="queueTrack('${t.uri}', this)">+ Queue</button></td>
          <td style="color:#888; font-size:12px">${escHtml(t.artist)}</td>
          <td style="color:#888; font-size:12px">${escHtml(t.album || '')}</td>
          <td style="text-align:center; color:#888">${formatTrackDuration(t.duration_ms)}</td>
          <td style="text-align:center; color:#888">${t.popularity || '-'}</td>
          <td style="color:#888; font-size:12px">${t.release_date || '-'}</td>
          <td style="color:#888; font-size:12px">${t.inLibrary ? playlistLinks(t.playlists) : ''}</td>
        </tr>`;
      }).join('');

      const allChecked = sorted.length > 0 && sorted.every(t => selectedTrackUris.has(t.uri));

      document.getElementById('content').innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
          <button class="btn btn-secondary btn-small" onclick="history.back()">&#8592; Back</button>
          <h2 style="color:#1DB954; font-size:20px;">${escHtml(resolvedArtist)} <span style="color:#888; font-size:14px; font-weight:normal;">— Full Discography</span></h2>
          <a class="btn btn-secondary btn-small" href="/artist/${encodeURIComponent(resolvedArtist)}">View library tracks</a>
        </div>
        ${genres.length > 0 ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">${genres.map(g => `<a href="/genre/${encodeURIComponent(g)}" class="artist-chip">${escHtml(g)}</a>`).join('')}</div>` : ''}
        <div class="detail-stats">
          <div class="detail-stat"><div class="value">${tracks.length}</div><div class="label">Tracks</div></div>
          <div class="detail-stat"><div class="value">${albumCount}</div><div class="label">Releases</div></div>
          <div class="detail-stat"><div class="value">${formatDuration(totalMs)}</div><div class="label">Duration</div></div>
          <div class="detail-stat"><div class="value">${inLibraryCount}</div><div class="label">In Library</div></div>
        </div>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
          <input type="text" id="discogFilterInput" placeholder="Filter tracks..." oninput="onFilterInput()" value="${escHtml(rawFilter)}" class="search-input" style="width:300px;">
          <button class="btn ${hideDuplicates ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="toggleDuplicates()">
            ${hideDuplicates ? '&#10003; Hiding duplicates' : 'Show all versions'}
          </button>
          <span style="color:#888; font-size:12px;">${hideDuplicates && hiddenDupeCount > 0 ? `${hiddenDupeCount} duplicate version(s) hidden` : ''}</span>
        </div>
        <div class="action-bar" style="margin-bottom:12px;">
          <select id="targetPlaylist" class="sort-select" style="width:220px; padding:6px 10px; font-size:13px;">
            <option value="">Select target playlist...</option>
            ${targetOptions}
          </select>
          <span id="selectedCount">${selectedTrackUris.size} selected</span>
          <button class="btn btn-primary btn-small" onclick="addToPlaylist()">Add to Playlist</button>
          <button class="btn btn-secondary btn-small" onclick="clearSelection()">Clear</button>
          <button class="btn btn-secondary btn-small" onclick="selectNotInLibrary()">Select not in library</button>
          <span style="margin-left:12px; display:inline-flex; align-items:center; gap:4px;">
            <input type="number" id="popThreshold" value="${document.getElementById('popThreshold')?.value || '50'}" min="0" max="100" style="width:50px; padding:4px 6px; border:1px solid #333; border-radius:4px; background:#252525; color:#e0e0e0; font-size:12px;">
            <button class="btn btn-secondary btn-small" onclick="selectByPop('above')">Select above</button>
            <button class="btn btn-secondary btn-small" onclick="selectByPop('below')">Select below</button>
          </span>
        </div>
        <table class="data-table">
          <thead><tr>
            <th style="width:40px"><input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleAllTracks(this.checked)"></th>
            <th style="width:40px">#</th>
            <th class="sortable" onclick="doSort('name')">Title${arrow('name')}</th>
            <th class="sortable" onclick="doSort('artist')">Artist${arrow('artist')}</th>
            <th class="sortable" onclick="doSort('album')">Album${arrow('album')}</th>
            <th class="sortable" style="text-align:center" onclick="doSort('duration_ms')">Dur${arrow('duration_ms')}</th>
            <th class="sortable" style="text-align:center" onclick="doSort('popularity')">Pop${arrow('popularity')}</th>
            <th class="sortable" onclick="doSort('release_date')">Released${arrow('release_date')}</th>
            <th class="sortable" onclick="doSort('library')">In Playlists${arrow('library')}</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      const filterEl = document.getElementById('discogFilterInput');
      if (filterEl && document.activeElement !== filterEl) { filterEl.focus(); filterEl.setSelectionRange(filterEl.value.length, filterEl.value.length); }
    }

    let _filterUrlTimeout = null;
    function onFilterInput() {
      render();
      // Debounce the URL update so typing doesn't thrash the address bar.
      clearTimeout(_filterUrlTimeout);
      _filterUrlTimeout = setTimeout(syncUrl, 400);
    }

    function toggleDuplicates() {
      hideDuplicates = !hideDuplicates;
      syncUrl();
      render();
    }

    function doSort(field) {
      if (sortField === field) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortField = field; sortDir = (field === 'duration_ms' || field === 'popularity' || field === 'release_date' || field === 'library') ? 'desc' : 'asc'; }
      syncUrl();
      render();
    }

    function toggleTrack(uri, name, artist, checked) {
      if (checked) selectedTrackUris.set(uri, { name, artist }); else selectedTrackUris.delete(uri);
      const el = document.getElementById('selectedCount');
      if (el) el.textContent = `${selectedTrackUris.size} selected`;
    }
    // The set of tracks currently on screen (respects the filter box and the
    // hide-duplicates toggle) so selection actions never touch hidden versions.
    function getVisibleTracks() {
      const filterText = (document.getElementById('discogFilterInput')?.value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const filtered = filterText
        ? tracks.filter(t => norm(t.name).includes(filterText) || norm(t.artist).includes(filterText) || norm(t.album).includes(filterText))
        : tracks;
      return hideDuplicates ? dedupeTracks(filtered).list : filtered;
    }

    function toggleAllTracks(checked) {
      for (const t of getVisibleTracks()) { if (checked) selectedTrackUris.set(t.uri, { name: t.name, artist: t.artist }); else selectedTrackUris.delete(t.uri); }
      render();
    }
    function clearSelection() { selectedTrackUris.clear(); render(); }

    function selectNotInLibrary() {
      for (const t of getVisibleTracks()) {
        if (!t.inLibrary) selectedTrackUris.set(t.uri, { name: t.name, artist: t.artist });
      }
      render();
    }

    function selectByPop(direction) {
      const threshold = parseInt(document.getElementById('popThreshold')?.value || '50', 10);
      for (const t of getVisibleTracks()) {
        const pop = t.popularity || 0;
        if (direction === 'above' ? pop >= threshold : pop < threshold) {
          selectedTrackUris.set(t.uri, { name: t.name, artist: t.artist });
        }
      }
      render();
    }

    async function addToPlaylist() {
      const targetId = document.getElementById('targetPlaylist').value;
      if (!targetId) { showToast('Select a target playlist first.', true); return; }
      if (selectedTrackUris.size === 0) { showToast('No tracks selected.', true); return; }
      const uris = [...selectedTrackUris.keys()];
      const targetName = document.getElementById('targetPlaylist').selectedOptions[0]?.text || '';
      try {
        const data = await addTracksWithDuplicateCheck(targetId, uris, targetName);
        if (!data) return;
        showToast(data.message);
        const addedUris = new Set(uris);
        for (const t of tracks) {
          if (addedUris.has(t.uri)) {
            t.inLibrary = true;
            if (!t.playlists.includes(targetName)) t.playlists.push(targetName);
          }
        }
        clearSelection();
      } catch (err) { showToast(err.message, true); }
    }

    init();
  </script>
</body>
</html>
